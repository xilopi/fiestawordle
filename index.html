    "TERSO","TESIS","TIGRE","TINTA","TIRAR","TODOS","TOMAR","TONTO",
    "TORRE","TOTAL","TRAJE","TRATO","TRIGO","TRIPA","TRONO","TROZO",
    "TUBOS","TURNO","UNIDO","USUAL","VACAS","VACIO","VALLE","VAPOR",
    "VARON","VASOS","VECES","VELAR","VELOZ","VENIR","VENTA","VERDE",
    "VERSO","VIAJE","VIDAS","VIEJO","VIGOR","VINOS","VIRUS","VISTA",
    "VIUDA","VIVIR","VIVOS","VOCAL","VOLAR","VUELO","YEGUA","ZONAS",
    "ZORRO"
  ];

  const ICE_SERVERS = [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:openrelay.metered.ca:80",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    {
      urls: "turn:openrelay.metered.ca:443",
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ];

  /*
   * ============================================================
   * CONFIGURACIÓN
   * ============================================================
   */

  const KEYBOARD_LAYOUT = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L","Ñ"],
    ["Z","X","C","V","B","N","M"]
  ];

  const MAX_PLAYERS = 7;
  const CONNECT_TIMEOUT_MS = 15000;
  const PEER_PREFIX = "duelo-7p-";

  /*
   * ============================================================
   * APP
   * ============================================================
   */

  (function () {
    "use strict";

    const els = {
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),

      screenLobby: document.getElementById("screen-lobby"),
      screenGame: document.getElementById("screen-game"),

      userNameInput: document.getElementById("userNameInput"),
      setupPanels: document.getElementById("setupPanels"),

      btnHost: document.getElementById("btnHost"),
      btnJoin: document.getElementById("btnJoin"),
      joinCodeInput: document.getElementById("joinCodeInput"),

      lobbyMsg: document.getElementById("lobbyMsg"),

      roomArea: document.getElementById("roomArea"),
      roomCodeDisplay: document.getElementById("roomCodeDisplay"),
      playersList: document.getElementById("playersList"),

      btnReady: document.getElementById("btnReady"),
      btnStartGame: document.getElementById("btnStartGame"),

      boardMe: document.getElementById("boardMe"),
      virtualKeyboard: document.getElementById("virtualKeyboard"),
      rivalsGrid: document.getElementById("rivalsGrid"),

      countdownOverlay:
        document.getElementById("countdownOverlay"),

      countdownNumber:
        document.getElementById("countdownNumber"),

      resultOverlay:
        document.getElementById("resultOverlay"),

      resultWord:
        document.getElementById("resultWord"),

      leaderboard:
        document.getElementById("leaderboard"),

      hostStatusCounter:
        document.getElementById("hostStatusCounter"),

      btnNextRound:
        document.getElementById("btnNextRound"),

      btnPlayerReadyNext:
        document.getElementById("btnPlayerReadyNext"),

      btnBackLobby:
        document.getElementById("btnBackLobby"),

      toast:
        document.getElementById("toast")
    };

    /*
     * ============================================================
     * ESTADO
     * ============================================================
     */

    let myName = "";
    let myId = "";

    let isHost = false;
    let roomCode = "";

    let peer = null;
    let connections = {};

    let players = {};

    let secretWord = "";

    let currentRow = 0;
    let currentCol = 0;

    let rowBuffers = Array.from(
      { length: 6 },
      () => Array(5).fill("")
    );

    let isReady = false;
    let isReadyNextRound = false;

    let winnerCount = 0;
    let finishedCount = 0;

    let keyStates = {};

    /*
     * ============================================================
     * NOMBRE GUARDADO
     * ============================================================
     */

    const savedName =
      localStorage.getItem("duelo_nickname");

    if (savedName) {
      els.userNameInput.value = savedName;
    }

    /*
     * ============================================================
     * UTILIDADES
     * ============================================================
     */

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.remove("hidden");

      setTimeout(() => {
        els.toast.classList.add("hidden");
      }, 2500);
    }

    function setStatus(state, text) {
      els.statusDot.className =
        "status-dot " + state;

      els.statusText.textContent = text;
    }

    function getValidName() {
      const val =
        els.userNameInput.value.trim() ||
        "Jugador_" +
          Math.floor(
            1000 + Math.random() * 9000
          );

      localStorage.setItem(
        "duelo_nickname",
        val
      );

      return val;
    }

    function generate4DigitCode() {
      return Math.floor(
        1000 + Math.random() * 9000
      ).toString();
    }

    /*
     * ============================================================
     * COPIAR CÓDIGO
     * ============================================================
     */

    els.roomCodeDisplay.addEventListener(
      "click",
      () => {
        if (!roomCode) return;

        navigator.clipboard
          .writeText(roomCode)
          .then(() => {
            showToast(
              "¡Código copiado al portapapeles!"
            );
          })
          .catch(() => {
            showToast(
              "Código: " + roomCode
            );
          });
      }
    );

    /*
     * ============================================================
     * CREAR SALA
     * ============================================================
     */

    els.btnHost.addEventListener(
      "click",
      () => {
        myName = getValidName();

        roomCode =
          generate4DigitCode();

        myId =
          PEER_PREFIX + roomCode;

        isHost = true;

        initPeer(myId);
      }
    );

    /*
     * ============================================================
     * UNIRSE
     * ============================================================
     */

    els.btnJoin.addEventListener(
      "click",
      () => {
        const code =
          els.joinCodeInput.value.trim();

        if (code.length !== 4) {
          showToast(
            "El código debe tener 4 números"
          );

          return;
        }

        myName = getValidName();

        roomCode = code;

        isHost = false;

        myId =
          PEER_PREFIX +
          Math.floor(
            100000 +
              Math.random() * 900000
          );

        initPeer(
          myId,
          PEER_PREFIX + roomCode
        );
      }
    );

    /*
     * ============================================================
     * PEER
     * ============================================================
     */

    function initPeer(
      id,
      hostToConnect = null
    ) {
      setStatus(
        "connecting",
        "generando código"
      );

      els.lobbyMsg.textContent =
        "Conectando al servidor...";

      peer = new Peer(id, {
        debug: 1,
        config: {
          iceServers: ICE_SERVERS
        }
      });

      peer.on("open", () => {
        setStatus(
          "connecting",
          "esperando rivales"
        );

        els.lobbyMsg.textContent = "";

        els.setupPanels.classList.add(
          "hidden"
        );

        els.roomArea.classList.remove(
          "hidden"
        );

        els.roomCodeDisplay.textContent =
          roomCode;

        if (isHost) {
          els.btnStartGame.classList.remove(
            "hidden"
          );
        }

        players[myId] =
          createPlayerData(myName);

        updatePlayersUI();

        if (hostToConnect) {
          connectToPeer(hostToConnect);
        }
      });

      peer.on(
        "connection",
        conn => {
          attachConnHandlers(conn);
        }
      );

      peer.on("error", err => {
        console.error(err);

        showToast(
          "Error de conexión"
        );

        setStatus(
          "",
          "error"
        );

        els.lobbyMsg.textContent =
          "No se pudo conectar, revisa tu conexión e intenta de nuevo";
      });
    }

    function createPlayerData(name) {
      return {
        name,
        ready: false,
        readyNext: false,
        row: 0,
        finished: false,
        won: false,
        rank: null,
        greens: 0,
        yellows: 0,
        finishTime: 0
      };
    }

    function connectToPeer(targetId) {
      els.lobbyMsg.textContent =
        "Conectando con la sala...";

      setStatus(
        "connecting",
        "conectando"
      );

      const conn =
        peer.connect(targetId);

      attachConnHandlers(conn);
    }

    function attachConnHandlers(conn) {
      let settled = false;

      const timeoutId =
        setTimeout(() => {
          if (settled) return;

          settled = true;

          try {
            conn.close();
          } catch (err) {}

          delete connections[
            conn.peer
          ];

          if (isHost) {
            els.lobbyMsg.textContent =
              "Un rival no pudo conectar, esperando nuevos jugadores...";

            setStatus(
              "connecting",
              "esperando rivales"
            );
          } else {
            els.lobbyMsg.textContent =
              "No se pudo conectar, verifica el código de la sala";

            setStatus(
              "",
              "sin conectar"
            );
          }
        }, CONNECT_TIMEOUT_MS);

      conn.on("open", () => {
        if (settled) return;

        settled = true;

        clearTimeout(timeoutId);

        if (
          isHost &&
          Object.keys(players).length >=
            MAX_PLAYERS
        ) {
          conn.send({
            type: "full"
          });

          conn.close();

          return;
        }

        els.lobbyMsg.textContent =
          "¡Jugador conectado!";

        setStatus(
          "connected",
          "conectado"
        );

        connections[conn.peer] =
          conn;

        conn.send({
          type: "join",
          name: myName
        });
      });

      conn.on("data", data => {
        handleData(
          conn.peer,
          data
        );
      });

      conn.on("close", () => {
        settled = true;

        clearTimeout(timeoutId);

        delete connections[
          conn.peer
        ];

        delete players[
          conn.peer
        ];

        updatePlayersUI();

        checkAllReady();

        updateHostCounter();

        showToast(
          "Un jugador se ha desconectado"
        );
      });

      conn.on("error", err => {
        settled = true;

        clearTimeout(timeoutId);

        console.error(err);

        showToast(
          "Error en la conexión"
        );
      });
    }

    function broadcast(data) {
      Object.values(
        connections
      ).forEach(conn => {
        if (conn.open) {
          conn.send(data);
        }
      });
    }

    /*
     * ============================================================
     * DATOS RECIBIDOS
     * ============================================================
     */

    function handleData(
      senderId,
      data
    ) {
      switch (data.type) {
        case "full":

          showToast(
            "La sala está llena (máximo 7 jugadores)"
          );

          location.reload();

          break;

        case "kicked":

          showToast(
            "Has sido expulsado de la sala"
          );

          setTimeout(() => {
            location.reload();
          }, 1500);

          break;

        case "join":

          players[senderId] =
            createPlayerData(
              data.name
            );

          updatePlayersUI();

          if (isHost) {
            broadcastList();
          }

          break;

        case "player-list":

          players =
            data.players;

          updatePlayersUI();

          break;

        case "ready":

          if (players[senderId]) {
            players[senderId].ready =
              data.ready;
          }

          updatePlayersUI();

          checkAllReady();

          break;

        case "ready-next":

          if (players[senderId]) {
            players[senderId].readyNext =
              data.readyNext;
          }

          if (isHost) {
            updateHostCounter();
            broadcastList();
          }

          break;

        case "start-countdown":

          secretWord =
            data.word;

          startCountdown();

          break;

        case "guess":

          if (players[senderId]) {

            players[senderId].row =
              data.row + 1;

            players[senderId].greens =
              data.greens;

            players[senderId].yellows =
              data.yellows;

            updateRivalBoard(
              senderId,
              data.row,
              data.pattern
            );
          }

          break;

        case "finish":

          if (players[senderId]) {

            players[senderId].finished =
              true;

            players[senderId].won =
              data.won;

            players[senderId].rank =
              data.rank;

            players[senderId].greens =
              data.greens;

            players[senderId].yellows =
              data.yellows;

            players[senderId].finishTime =
              data.finishTime;

            finishedCount++;

            if (data.won) {
              winnerCount++;
            }

            if (
              Object.keys(players).length ===
                2 &&
              !data.won
            ) {
              resolveDuelLoss(
                senderId
              );
            }

            checkGameEnd();
          }

          break;
      }
    }

    function broadcastList() {
      broadcast({
        type: "player-list",
        players
      });
    }

    /*
     * ============================================================
     * EXPULSAR
     * ============================================================
     */

    function kickPlayer(targetId) {
      if (
        !isHost ||
        !connections[targetId]
      ) {
        return;
      }

      connections[targetId].send({
        type: "kicked"
      });

      setTimeout(() => {

        if (
          connections[targetId]
        ) {
          connections[
            targetId
          ].close();
        }

        delete connections[
          targetId
        ];

        delete players[
          targetId
        ];

        updatePlayersUI();

        broadcastList();

        checkAllReady();

        updateHostCounter();

        showToast(
          "Jugador expulsado"
        );

      }, 200);
    }

    /*
     * ============================================================
     * UI JUGADORES
     * ============================================================
     */

    function updatePlayersUI() {
      els.playersList.innerHTML = "";

      Object.entries(
        players
      ).forEach(([id, p]) => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "player-item";

        const showKick =
          isHost &&
          id !== myId;

        item.innerHTML = `
          <div class="player-info-group">
            <span>
              ${p.name}
              ${
                id === myId
                  ? "<strong>(Tú)</strong>"
                  : ""
              }
              ${
                id ===
                PEER_PREFIX + roomCode
                  ? "👑"
                  : ""
              }
            </span>

            ${
              showKick
                ? `
                  <button
                    class="btn-kick"
                    data-kick="${id}"
                  >
                    Expulsar
                  </button>
                `
                : ""
            }
          </div>

          <span
            class="player-badge ${
              p.ready
                ? "badge-ready"
                : "badge-waiting"
            }"
          >
            ${
              p.ready
                ? "LISTO"
                : "ESPERANDO"
            }
          </span>
        `;

        if (showKick) {
          item
            .querySelector(
              `[data-kick="${id}"]`
            )
            .addEventListener(
              "click",
              () => {
                kickPlayer(id);
              }
            );
        }

        els.playersList.appendChild(
          item
        );
      });

      checkAllReady();
    }

    /*
     * ============================================================
     * READY
     * ============================================================
     */

    els.btnReady.addEventListener(
      "click",
      () => {

        isReady = !isReady;

        players[myId].ready =
          isReady;

        els.btnReady.textContent =
          isReady
            ? "CANCELAR"
            : "¡ESTOY LISTO!";

        els.btnReady.style.background =
          isReady
            ? "var(--gray-tile)"
            : "var(--green)";

        updatePlayersUI();

        if (isHost) {
          broadcastList();
        } else {
          broadcast({
            type: "ready",
            ready: isReady
          });
        }
      }
    );

    function checkAllReady() {
      if (!isHost) return;

      const pList =
        Object.values(players);

      const canStart =
        pList.length >= 2 &&
        pList.every(
          p => p.ready
        );

      els.btnStartGame.disabled =
        !canStart;
    }

    /*
     * ============================================================
     * COMENZAR PARTIDA
     * ============================================================
     */

    els.btnStartGame.addEventListener(
      "click",
      () => {

        if (!isHost) return;

        secretWord =
          WORDS[
            Math.floor(
              Math.random() *
                WORDS.length
            )
          ];

        broadcast({
          type:
            "start-countdown",
          word: secretWord
        });

        startCountdown();
      }
    );

    function startCountdown() {
      els.screenLobby.classList.add(
        "hidden"
      );

      els.resultOverlay.classList.add(
        "hidden"
      );

      els.countdownOverlay.classList.remove(
        "hidden"
      );

      let count = 3;

      els.countdownNumber.textContent =
        count;

      const timer =
        setInterval(() => {

          count--;

          if (count > 0) {
            els.countdownNumber.textContent =
              count;
          } else {

            clearInterval(timer);

            els.countdownOverlay.classList.add(
              "hidden"
            );

            startGame();
          }

        }, 900);
    }

    /*
     * ============================================================
     * INICIAR PARTIDA
     * ============================================================
     */

    function startGame() {

      currentRow = 0;
      currentCol = 0;

      rowBuffers =
        Array.from(
          { length: 6 },
          () => Array(5).fill("")
        );

      winnerCount = 0;
      finishedCount = 0;
      keyStates = {};

      isReadyNextRound = false;

      Object.keys(players)
        .forEach(id => {

          players[id].row = 0;
          players[id].finished = false;
          players[id].won = false;
          players[id].rank = null;
          players[id].greens = 0;
          players[id].yellows = 0;
          players[id].finishTime = 0;
          players[id].readyNext = false;
        });

      els.btnPlayerReadyNext.textContent =
        "Listo para otra ronda";

      els.btnPlayerReadyNext.style.background =
        "var(--green)";

      els.screenGame.classList.remove(
        "hidden"
      );

      setStatus(
        "connected",
        "en partida"
      );

      buildMyBoard();

      buildVirtualKeyboard();

      buildRivalBoards();

      /*
       * IMPORTANTE:
       *
       * Ya NO hacemos focus() sobre un input.
       *
       * Esto evita que iOS/Android abra el teclado nativo.
       */
      updateFocusedTile();
    }

    /*
     * ============================================================
     * TABLERO PROPIO
     * ============================================================
     */

    function buildMyBoard() {

      els.boardMe.innerHTML = "";

      for (
        let r = 0;
        r < 6;
        r++
      ) {

        const rowForm =
          document.createElement(
            "form"
          );

        rowForm.className =
          "board-row";

        rowForm.dataset.row = r;

        rowForm.addEventListener(
          "submit",
          e => {
            e.preventDefault();
            submitGuess();
          }
        );

        for (
          let c = 0;
          c < 5;
          c++
        ) {

          const wrap =
            document.createElement(
              "div"
            );

          wrap.className =
            "tile-wrap";

          wrap.dataset.row = r;
          wrap.dataset.col = c;

          /*
           * La casilla ya NO necesita un input
           * editable.
           *
           * Esto evita completamente el teclado
           * nativo del móvil.
           */

          const tile =
            document.createElement(
              "div"
            );

          tile.className =
            "tile";

          /*
           * Permite tocar una casilla para
           * seleccionarla.
           */
          tile.addEventListener(
            "click",
            () => {

              if (
                r !== currentRow ||
                players[myId].finished
              ) {
                return;
              }

              currentCol = c;

              updateFocusedTile();
            }
          );

          wrap.appendChild(tile);

          rowForm.appendChild(
            wrap
          );
        }

        els.boardMe.appendChild(
          rowForm
        );
      }
    }

    /*
     * ============================================================
     * TECLADO VIRTUAL
     * ============================================================
     */

    function buildVirtualKeyboard() {

      els.virtualKeyboard.innerHTML = "";

      KEYBOARD_LAYOUT.forEach(
        rowKeys => {

          const rowDiv =
            document.createElement(
              "div"
            );

          rowDiv.className =
            "keyboard-row";

          rowKeys.forEach(
            key => {

              const keyDiv =
                document.createElement(
                  "button"
                );

              /*
               * MUY IMPORTANTE:
               *
               * type="button" evita que el
               * teclado actúe como submit.
               */
              keyDiv.type = "button";

              keyDiv.className =
                "key-tile";

              keyDiv.dataset.key =
                key;

              keyDiv.textContent =
                key;

              /*
               * pointerdown funciona especialmente
               * bien en móvil y evita comportamientos
               * raros del navegador.
               */
              keyDiv.addEventListener(
                "pointerdown",
                e => {

                  e.preventDefault();

                  pressVirtualKey(
                    key
                  );
                }
              );

              rowDiv.appendChild(
                keyDiv
              );
            }
          );

          /*
           * BOTÓN BORRAR
           */

          if (
            rowKeys ===
            KEYBOARD_LAYOUT[2]
          ) {

            const deleteKey =
              document.createElement(
                "button"
              );

            deleteKey.type =
              "button";

            deleteKey.className =
              "key-tile key-delete";

            deleteKey.textContent =
              "⌫";

            deleteKey.addEventListener(
              "pointerdown",
              e => {

                e.preventDefault();

                pressVirtualKey(
                  "BACKSPACE"
                );
              }
            );

            rowDiv.appendChild(
              deleteKey
            );
          }

          /*
           * ENTER
           */

          if (
            rowKeys ===
            KEYBOARD_LAYOUT[2]
          ) {

            const enterKey =
              document.createElement(
                "button"
              );

            enterKey.type =
              "button";

            enterKey.className =
              "key-tile key-enter";

            enterKey.textContent =
              "ENTER";

            enterKey.addEventListener(
              "pointerdown",
              e => {

                e.preventDefault();

                pressVirtualKey(
                  "ENTER"
                );
              }
            );

            rowDiv.appendChild(
              enterKey
            );
          }

          els.virtualKeyboard.appendChild(
            rowDiv
          );
        }
      );

      updateKeyboardVisuals();
    }

    /*
     * ============================================================
     * TECLA VIRTUAL
     * ============================================================
     */

    function pressVirtualKey(
      key
    ) {

      if (
        !players[myId] ||
        players[myId].finished
      ) {
        return;
      }

      /*
       * LETRA
       */

      if (
        KEYBOARD_LAYOUT
          .flat()
          .includes(key)
      ) {

        if (
          currentCol >= 5
        ) {
          return;
        }

        setLetter(
          currentRow,
          currentCol,
          key
        );

        if (
          currentCol < 4
        ) {
          currentCol++;
        }

        updateFocusedTile();

        return;
      }

      /*
       * BORRAR
       */

      if (
        key === "BACKSPACE"
      ) {

        /*
         * Si hay una letra en la
         * posición actual, la borramos.
         */
        if (
          rowBuffers[
            currentRow
          ][currentCol]
        ) {

          setLetter(
            currentRow,
            currentCol,
            ""
          );

        }
        /*
         * Si estamos en una casilla
         * vacía, retrocedemos.
         */
        else if (
          currentCol > 0
        ) {

          currentCol--;

          setLetter(
            currentRow,
            currentCol,
            ""
          );
        }

        updateFocusedTile();

        return;
      }

      /*
       * ENTER
       */

      if (
        key === "ENTER"
      ) {

        submitGuess();

        return;
      }
    }

    /*
     * ============================================================
     * TECLADO FÍSICO
     * ============================================================
     *
     * Esto permite jugar en PC sin input HTML.
     * En móvil no se abre ningún teclado porque
     * no hacemos focus de ningún input.
     */

    document.addEventListener(
      "keydown",
      e => {

        if (
          els.screenGame.classList.contains(
            "hidden"
          )
        ) {
          return;
        }

        if (
          !players[myId] ||
          players[myId].finished
        ) {
          return;
        }

        /*
         * ENTER
         */

        if (
          e.key === "Enter"
        ) {

          e.preventDefault();

          submitGuess();

          return;
        }

        /*
         * BACKSPACE
         */

        if (
          e.key === "Backspace"
        ) {

          e.preventDefault();

          pressVirtualKey(
            "BACKSPACE"
          );

          return;
        }

        /*
         * LETRAS
         */

        const key =
          e.key.toUpperCase();

        if (
          KEYBOARD_LAYOUT
            .flat()
            .includes(key)
        ) {

          e.preventDefault();

          pressVirtualKey(
            key
          );
        }
      }
    );

    /*
     * ============================================================
     * LETRA
     * ============================================================
     */

    function setLetter(
      r,
      c,
      letter
    ) {

      rowBuffers[r][c] =
        letter;

      const wrap =
        els.boardMe.querySelector(
          `.tile-wrap[data-row="${r}"][data-col="${c}"]`
        );

      if (wrap) {

        wrap.querySelector(
          ".tile"
        ).textContent =
          letter;
      }
    }

    /*
     * ============================================================
     * CASILLA SELECCIONADA
     * ============================================================
     */

    function updateFocusedTile() {

      document
        .querySelectorAll(
          ".tile-wrap"
        )
        .forEach(w => {
          w.classList.remove(
            "focused"
          );
        });

      if (
        !players[myId] ||
        players[myId].finished
      ) {
        return;
      }

      const wrap =
        els.boardMe.querySelector(
          `.tile-wrap[data-row="${currentRow}"][data-col="${currentCol}"]`
        );

      if (wrap) {
        wrap.classList.add(
          "focused"
        );
      }
    }

    /*
     * ============================================================
     * TABLEROS RIVALES
     * ============================================================
     */

    function buildRivalBoards() {

      els.rivalsGrid.innerHTML = "";

      Object.entries(
        players
      ).forEach(([id, p]) => {

        if (id === myId) return;

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "rival-card";

        card.id =
          `rival-card-${id}`;

        card.innerHTML = `
          <div class="rival-header">
            <span>${p.name}</span>
            <span id="rival-att-${id}">
              0/6
            </span>
          </div>

          <div
            class="board board--rival"
            id="board-rival-${id}"
          ></div>
        `;

        const board =
          card.querySelector(
            `#board-rival-${id}`
          );

        for (
          let r = 0;
          r < 6;
          r++
        ) {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "board-row";

          row.dataset.row =
            r;

          for (
            let c = 0;
            c < 5;
            c++
          ) {

            const wrap =
              document.createElement(
                "div"
              );

            wrap.className =
              "tile-wrap";

            const tile =
              document.createElement(
                "div"
              );

            tile.className =
              "tile";

            wrap.appendChild(
              tile
            );

            row.appendChild(
              wrap
            );
          }

          board.appendChild(
            row
          );
        }

        els.rivalsGrid.appendChild(
          card
        );
      });
    }

    function updateRivalBoard(
      rivalId,
      r,
      pattern
    ) {

      const card =
        document.getElementById(
          `rival-card-${rivalId}`
        );

      if (!card) return;

      card.querySelector(
        `#rival-att-${rivalId}`
      ).textContent =
        `${r + 1}/6`;

      const row =
        card.querySelector(
          `.board-row[data-row="${r}"]`
        );

      if (!row) return;

      const tiles =
        row.querySelectorAll(
          ".tile"
        );

      tiles.forEach(
        (tile, i) => {

          tile.classList.add(
            pattern[i]
          );
        }
      );
    }

    /*
     * ============================================================
     * TECLADO: COLORES
     * ============================================================
     */

    function updateVirtualKeyboard(
      word,
      pattern
    ) {

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        const letter =
          word[i];

        const status =
          pattern[i];

        if (
          status ===
          "correct"
        ) {

          keyStates[
            letter
          ] = "correct";

        } else if (
          status ===
            "present" &&
          keyStates[
            letter
          ] !== "correct"
        ) {

          keyStates[
            letter
          ] = "present";

        } else if (
          status ===
            "absent" &&
          !keyStates[
            letter
          ]
        ) {

          keyStates[
            letter
          ] = "absent";
        }
      }

      updateKeyboardVisuals();
    }

    function updateKeyboardVisuals() {

      Object.entries(
        keyStates
      ).forEach(
        ([letter, state]) => {

          const keyEl =
            els.virtualKeyboard.querySelector(
              `.key-tile[data-key="${letter}"]`
            );

          if (!keyEl) return;

          keyEl.classList.remove(
            "correct",
            "present",
            "absent"
          );

          keyEl.classList.add(
            state
          );
        }
      );
    }

    /*
     * ============================================================
     * RESOLVER DERROTA 1 VS 1
     * ============================================================
     */

    function resolveDuelLoss(
      loserId
    ) {

      const playerIds =
        Object.keys(players);

      if (
        playerIds.length !== 2
      ) {
        return;
      }

      const winnerId =
        playerIds.find(
          id =>
            id !== loserId
        );

      if (!winnerId) {
        return;
      }

      const loser =
        players[loserId];

      const winner =
        players[winnerId];

      loser.won = false;
      loser.rank = 2;
      loser.finished = true;

      winner.won = true;
      winner.rank = 1;
      winner.finished = true;

      if (
        !winner.finishTime
      ) {
        winner.finishTime =
          Date.now();
      }

      winnerCount = 1;
    }

    /*
     * ============================================================
     * ENVIAR PALABRA
     * ============================================================
     */

    function submitGuess() {

      if (
        !players[myId] ||
        players[myId].finished
      ) {
        return;
      }

      const word =
        rowBuffers[
          currentRow
        ].join("");

      if (
        word.length < 5
      ) {

        showToast(
          "Completa las 5 letras"
        );

        return;
      }

      const pattern =
        evaluateGuess(
          word,
          secretWord
        );

      paintRow(
        currentRow,
        pattern
      );

      updateVirtualKeyboard(
        word,
        pattern
      );

      const currentGreens =
        pattern.filter(
          p =>
            p === "correct"
        ).length;

      const currentYellows =
        pattern.filter(
          p =>
            p === "present"
        ).length;

      players[myId].greens +=
        currentGreens;

      players[myId].yellows +=
        currentYellows;

      broadcast({
        type: "guess",

        row: currentRow,

        pattern,

        greens:
          players[myId].greens,

        yellows:
          players[myId].yellows
      });

      const won =
        pattern.every(
          p =>
            p === "correct"
        );

      /*
       * GANADOR
       */

      if (won) {

        players[myId].finished =
          true;

        players[myId].won =
          true;

        players[myId].finishTime =
          Date.now();

        winnerCount++;

        const rank =
          winnerCount;

        players[myId].rank =
          rank;

        /*
         * 1 VS 1
         */

        if (
          Object.keys(players).length ===
          2
        ) {

          const opponentId =
            Object.keys(
              players
            ).find(
              id =>
                id !== myId
            );

          if (opponentId) {

            players[
              opponentId
            ].won = false;

            players[
              opponentId
            ].rank = 2;

            players[
              opponentId
            ].finished = true;
          }
        }

        finishedCount++;

        broadcast({
          type: "finish",

          won: true,

          rank,

          greens:
            players[myId].greens,

          yellows:
            players[myId].yellows,

          finishTime:
            players[myId].finishTime
        });

        showToast(
          `¡Adivinaste! Puesto #${rank}`
        );

        updateFocusedTile();

        checkGameEnd();

        return;
      }

      /*
       * SE HAN AGOTADO LOS INTENTOS
       */

      if (
        currentRow >= 5
      ) {

        players[myId].finished =
          true;

        players[myId].won =
          false;

        players[myId].rank =
          null;

        players[myId].finishTime =
          Date.now();

        finishedCount++;

        if (
          Object.keys(players).length ===
          2
        ) {

          resolveDuelLoss(
            myId
          );
        }

        broadcast({
          type: "finish",

          won: false,

          rank:
            Object.keys(players).length ===
            2
              ? 2
              : null,

          greens:
            players[myId].greens,

          yellows:
            players[myId].yellows,

          finishTime:
            players[myId].finishTime
        });

        showToast(
          "Has agotado tus intentos"
        );

        updateFocusedTile();

        checkGameEnd();

        return;
      }

      /*
       * SIGUIENTE FILA
       */

      currentRow++;

      currentCol = 0;

      updateFocusedTile();
    }

    /*
     * ============================================================
     * EVALUAR PALABRA
     * ============================================================
     */

    function evaluateGuess(
      guess,
      target
    ) {

      const res =
        Array(5).fill(
          "absent"
        );

      const tArr =
        target.split("");

      const used =
        Array(5).fill(
          false
        );

      /*
       * VERDES
       */

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        if (
          guess[i] ===
          tArr[i]
        ) {

          res[i] =
            "correct";

          used[i] =
            true;
        }
      }

      /*
       * AMARILLAS
       */

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        if (
          res[i] ===
          "correct"
        ) {
          continue;
        }

        const idx =
          tArr.findIndex(
            (l, j) =>
              !used[j] &&
              l === guess[i]
          );

        if (
          idx !== -1
        ) {

          res[i] =
            "present";

          used[idx] =
            true;
        }
      }

      return res;
    }

    /*
     * ============================================================
     * PINTAR FILA
     * ============================================================
     */

    function paintRow(
      r,
      pattern
    ) {

      const row =
        els.boardMe.querySelector(
          `.board-row[data-row="${r}"]`
        );

      if (!row) return;

      const wraps =
        row.querySelectorAll(
          ".tile-wrap"
        );

      wraps.forEach(
        (wrap, i) => {

          wrap
            .querySelector(
              ".tile"
            )
            .classList.add(
              pattern[i]
            );
        }
      );
    }

    /*
     * ============================================================
     * FIN PARTIDA
     * ============================================================
     */

    function checkGameEnd() {

      const totalPlayers =
        Object.keys(players)
          .length;

      /*
       * 1 VS 1
       */

      if (
        totalPlayers === 2
      ) {

        const duelWinner =
          Object.entries(
            players
          ).find(
            ([, p]) =>
              p.won
          );

        if (duelWinner) {

          const winnerId =
            duelWinner[0];

          const loserEntry =
            Object.entries(
              players
            ).find(
              ([id]) =>
                id !== winnerId
            );

          players[
            winnerId
          ].won = true;

          players[
            winnerId
          ].rank = 1;

          players[
            winnerId
          ].finished = true;

          if (loserEntry) {

            const loser =
              players[
                loserEntry[0]
              ];

            loser.won =
              false;

            loser.rank =
              2;

            loser.finished =
              true;
          }

          setTimeout(
            showFinalResults,
            800
          );

          return;
        }

        const someoneLost =
          Object.values(
            players
          ).some(
            p =>
              p.finished &&
              !p.won
          );

        if (
          someoneLost &&
          finishedCount >= 1
        ) {

          const loserEntry =
            Object.entries(
              players
            ).find(
              ([, p]) =>
                p.finished &&
                !p.won
            );

          if (loserEntry) {

            resolveDuelLoss(
              loserEntry[0]
            );
          }

          setTimeout(
            showFinalResults,
            800
          );

          return;
        }

        return;
      }

      /*
       * 3+ JUGADORES
       */

      const winners =
        Object.values(
          players
        ).filter(
          p => p.won
        ).length;

      const activePlayers =
        totalPlayers -
        finishedCount;

      if (
        finishedCount >=
        totalPlayers
      ) {

        setTimeout(
          showFinalResults,
          800
        );

      } else if (
        activePlayers === 1 &&
        winners ===
          totalPlayers - 1
      ) {

        setTimeout(
          showFinalResults,
          800
        );
      }
    }

    /*
     * ============================================================
     * CONTADOR SIGUIENTE RONDA
     * ============================================================
     */

    function updateHostCounter() {

      if (!isHost) return;

      const nonHostPlayers =
        Object.entries(
          players
        ).filter(
          ([id]) =>
            id !== myId
        );

      const readyCount =
        nonHostPlayers.filter(
          ([, p]) =>
            p.readyNext
        ).length;

      els.hostStatusCounter.textContent =
        `Listos para otra ronda: ${readyCount}/${nonHostPlayers.length}`;
    }

    /*
     * ============================================================
     * RESULTADOS
     * ============================================================
     */

    function showFinalResults() {

      els.resultOverlay.classList.remove(
        "hidden"
      );

      els.resultWord.textContent =
        secretWord;

      els.leaderboard.innerHTML =
        "";

      const sorted =
        Object.values(
          players
        ).sort(
          (a, b) => {

            /*
             * 1 VS 1
             *
             * SOLO rank.
             */

            if (
              Object.keys(
                players
              ).length === 2
            ) {

              return (
                (a.rank ?? 999) -
                (b.rank ?? 999)
              );
            }

            /*
             * 3+
             */

            if (
              a.won &&
              b.won
            ) {

              return (
                a.rank -
                b.rank
              );
            }

            if (a.won)
              return -1;

            if (b.won)
              return 1;

            if (
              b.greens !==
              a.greens
            ) {

              return (
                b.greens -
                a.greens
              );
            }

            if (
              b.yellows !==
              a.yellows
            ) {

              return (
                b.yellows -
                a.yellows
              );
            }

            return (
              a.finishTime -
              b.finishTime
            );
          }
        );

      sorted.forEach(
        (p, idx) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "leaderboard-item";

          let statusText =
            `#${idx + 1}`;

          let statusColor =
            "var(--text)";

          if (p.won) {

            statusText =
              `#${p.rank} (Ganador)`;

            statusColor =
              "var(--green)";

          } else {

            statusColor =
              "var(--red)";
          }

          item.innerHTML = `
            <div>
              <span
                style="font-weight:700;"
              >
                ${p.name}
              </span>

              <div
                class="leaderboard-stats"
              >
                <span>
                  🟩 ${p.greens}
                </span>

                <span>
                  🟨 ${p.yellows}
                </span>
              </div>
            </div>

            <strong
              style="color:${statusColor}"
            >
              ${statusText}
            </strong>
          `;

          els.leaderboard.appendChild(
            item
          );
        }
      );

      if (isHost) {

        els.btnNextRound.classList.remove(
          "hidden"
        );

        els.hostStatusCounter.classList.remove(
          "hidden"
        );

        els.btnPlayerReadyNext.classList.add(
          "hidden"
        );

        updateHostCounter();

      } else {

        els.btnNextRound.classList.add(
          "hidden"
        );

        els.hostStatusCounter.classList.add(
          "hidden"
        );

        els.btnPlayerReadyNext.classList.remove(
          "hidden"
        );
      }
    }

    /*
     * ============================================================
     * READY SIGUIENTE RONDA
     * ============================================================
     */

    els.btnPlayerReadyNext.addEventListener(
      "click",
      () => {

        isReadyNextRound =
          !isReadyNextRound;

        players[myId].readyNext =
          isReadyNextRound;

        els.btnPlayerReadyNext.textContent =
          isReadyNextRound
            ? "Esperando a que empiece..."
            : "Listo para otra ronda";

        els.btnPlayerReadyNext.style.background =
          isReadyNextRound
            ? "var(--gray-tile)"
            : "var(--green)";

        broadcast({
          type:
            "ready-next",

          readyNext:
            isReadyNextRound
        });
      }
    );

    /*
     * ============================================================
     * SIGUIENTE RONDA
     * ============================================================
     */

    els.btnNextRound.addEventListener(
      "click",
      () => {

        if (!isHost) return;

        secretWord =
          WORDS[
            Math.floor(
              Math.random() *
                WORDS.length
            )
          ];

        broadcast({
          type:
            "start-countdown",

          word:
            secretWord
        });

        startCountdown();
      }
    );

    /*
     * ============================================================
     * VOLVER AL MENÚ
     * ============================================================
     */

    els.btnBackLobby.addEventListener(
      "click",
      () => {
        location.reload();
      }
    );

  })();
</script>
