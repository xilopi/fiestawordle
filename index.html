<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Multijugador 1vs1</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #121213;
      --card-bg: #1a1a1b;
      --text: #ffffff;
      --green: #538d4e;
      --yellow: #b59f3b;
      --gray-tile: #3a3a3c;
      --border: #3a3a3c;
      --red: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .hidden { display: none !important; }

    /* Contenedor principal */
    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Pantalla Lobby */
    .lobby-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin-top: 20px;
    }

    .input-group {
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"] {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #272729;
      color: var(--text);
      font-size: 1rem;
      text-align: center;
      text-transform: uppercase;
    }

    button {
      padding: 10px 20px;
      border-radius: 4px;
      border: none;
      background: var(--green);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .players-list { margin: 15px 0; }
    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: #272729;
      margin-bottom: 5px;
      border-radius: 4px;
    }

    .badge-ready { color: var(--green); font-weight: bold; }
    .badge-waiting { color: var(--yellow); font-weight: bold; }
    .btn-kick { background: var(--red); padding: 4px 8px; font-size: 0.8rem; }

    /* Pantalla Juego */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .game-container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    .board { display: flex; flex-direction: column; gap: 5px; }
    .board-row { display: flex; gap: 5px; }

    .tile-wrap {
      position: relative;
      width: 50px;
      height: 50px;
    }

    .tile {
      width: 100%;
      height: 100%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .tile.correct { background: var(--green); border-color: var(--green); }
    .tile.present { background: var(--yellow); border-color: var(--yellow); }
    .tile.absent { background: var(--gray-tile); border-color: var(--gray-tile); }

    .tile-native-input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    /* Tableros Rivales */
    .rivals-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .rival-card {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
    }

    .board--rival .tile-wrap { width: 25px; height: 25px; }
    .board--rival .tile { font-size: 0.8rem; border-width: 1px; }

    /* Teclado Virtual */
    .keyboard { display: flex; flex-direction: column; gap: 6px; margin-top: 15px; }
    .keyboard-row { display: flex; justify-content: center; gap: 4px; }
    .key-tile {
      background: var(--gray-tile);
      padding: 10px 12px;
      border-radius: 4px;
      font-weight: bold;
      user-select: none;
    }
    .key-tile.correct { background: var(--green); }
    .key-tile.present { background: var(--yellow); }
    .key-tile.absent { opacity: 0.4; }

    /* Modales / Overlays */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      background: white;
      color: black;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      z-index: 200;
    }

    .status-bar {
      margin-bottom: 10px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="status-bar" class="status-bar">Estado: sin conectar</div>

    <!-- PANTALLA DE LOBBY -->
    <div id="screen-lobby" class="lobby-card">
      <h2>Wordle Multijugador</h2>
      
      <div id="lobby-setup" class="input-group">
        <input type="text" id="input-name" placeholder="Tu Nombre" maxlength="12">
        <button id="btn-create-room">Crear Sala</button>
        <hr style="border-color: var(--border); margin: 10px 0;">
        <input type="text" id="input-room-code" placeholder="Código de Sala" maxlength="5">
        <button id="btn-join-room">Unirse a Sala</button>
      </div>

      <div id="lobby-room" class="hidden">
        <p>Código de sala: <strong id="room-code-display" style="color: var(--yellow); font-size: 1.2rem;"></strong></p>
        <p id="lobby-msg" style="margin: 10px 0;"></p>
        
        <div id="players-list" class="players-list"></div>

        <button id="btn-ready">¡ESTOY LISTO!</button>
        <button id="btn-start-game" class="hidden" disabled>EMPEZAR PARTIDA</button>
      </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="screen-game" class="game-container hidden">
      <div>
        <div id="board-me" class="board"></div>
        <div id="virtual-keyboard" class="keyboard"></div>
      </div>

      <div>
        <h3>Rivales</h3>
        <div id="rivals-grid" class="rivals-grid"></div>
      </div>
    </div>
  </div>

  <!-- OVERLAY CONTEO REGRESIVO -->
  <div id="countdown-overlay" class="overlay hidden">
    <h1 style="font-size: 5rem;" id="countdown-number">3</h1>
  </div>

  <!-- OVERLAY RESULTADOS -->
  <div id="result-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2>Fin de la Partida</h2>
      <p style="margin: 10px 0;">La palabra era: <strong id="result-word" style="color: var(--green); text-transform: uppercase;"></strong></p>
      
      <div id="leaderboard" style="margin: 20px 0; text-align: left;"></div>

      <p id="host-status-counter" class="hidden" style="margin-bottom: 10px;"></p>
      <button id="btn-next-round" class="hidden">Siguiente Ronda</button>
      <button id="btn-player-ready-next" class="hidden">Listo para otra ronda</button>
      <button id="btn-back-lobby" style="background: var(--gray-tile); margin-top: 10px;">Salir al Lobby</button>
    </div>
  </div>

  <script>
    (function () {
      const WORDS = ["PERRO", "GATOS", "CASAS", "PLAZA", "ARBOL", "LIBRO", "FUEGO", "MUNDO", "PIANO", "TEXTO", "BARCO", "CIELO", "VERDE", "FRUTA", "NUBES"];
      const PEER_PREFIX = "wordle-1vs1-room-";
      const MAX_PLAYERS = 7;
      const CONNECT_TIMEOUT_MS = 10000;
      const KEYBOARD_LAYOUT = [
        ["Q","W","E","R","T","Y","U","I","O","P"],
        ["A","S","D","F","G","H","J","K","L","Ñ"],
        ["Z","X","C","V","B","N","M"]
      ];

      let peer = null;
      let connections = {};
      let players = {};
      let isHost = false;
      let roomCode = "";
      let myId = "";
      let myName = "";
      let isReady = false;

      let secretWord = "";
      let currentRow = 0;
      let currentCol = 0;
      let rowBuffers = [];
      let finishedCount = 0;
      let winnerCount = 0;
      let keyStates = {};
      let isReadyNextRound = false;

      const els = {
        statusBar: document.getElementById("status-bar"),
        screenLobby: document.getElementById("screen-lobby"),
        lobbySetup: document.getElementById("lobby-setup"),
        lobbyRoom: document.getElementById("lobby-room"),
        inputName: document.getElementById("input-name"),
        inputRoomCode: document.getElementById("input-room-code"),
        btnCreateRoom: document.getElementById("btn-create-room"),
        btnJoinRoom: document.getElementById("btn-join-room"),
        roomCodeDisplay: document.getElementById("room-code-display"),
        lobbyMsg: document.getElementById("lobby-msg"),
        playersList: document.getElementById("players-list"),
        btnReady: document.getElementById("btn-ready"),
        btnStartGame: document.getElementById("btn-start-game"),
        screenGame: document.getElementById("screen-game"),
        boardMe: document.getElementById("board-me"),
        virtualKeyboard: document.getElementById("virtual-keyboard"),
        rivalsGrid: document.getElementById("rivals-grid"),
        countdownOverlay: document.getElementById("countdown-overlay"),
        countdownNumber: document.getElementById("countdown-number"),
        resultOverlay: document.getElementById("result-overlay"),
        resultWord: document.getElementById("result-word"),
        leaderboard: document.getElementById("leaderboard"),
        btnNextRound: document.getElementById("btn-next-round"),
        btnPlayerReadyNext: document.getElementById("btn-player-ready-next"),
        hostStatusCounter: document.getElementById("host-status-counter"),
        btnBackLobby: document.getElementById("btn-back-lobby")
      };

      function setStatus(cls, text) {
        els.statusBar.textContent = `Estado: ${text}`;
      }

      function showToast(msg) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      }

      function createPlayerData(name) {
        return {
          name,
          ready: false,
          row: 0,
          greens: 0,
          yellows: 0,
          finished: false,
          won: false,
          rank: null,
          finishTime: 0,
          readyNext: false
        };
      }

      function generateCode() {
        return Math.random().toString(36).substring(2, 7).toUpperCase();
      }

      function initPeer(customId = null) {
        return new Promise((resolve, reject) => {
          peer = customId ? new Peer(customId) : new Peer();
          peer.on("open", (id) => {
            myId = id;
            resolve(id);
          });
          peer.on("error", (err) => reject(err));
          peer.on("connection", (conn) => {
            attachConnHandlers(conn);
          });
        });
      }

      els.btnCreateRoom.addEventListener("click", async () => {
        myName = els.inputName.value.trim();
        if (!myName) return showToast("Introduce tu nombre");

        roomCode = generateCode();
        isHost = true;
        try {
          await initPeer(PEER_PREFIX + roomCode);
          players[myId] = createPlayerData(myName);
          els.lobbySetup.classList.add("hidden");
          els.lobbyRoom.classList.remove("hidden");
          els.btnStartGame.classList.remove("hidden");
          els.roomCodeDisplay.textContent = roomCode;
          setStatus("connected", "esperando rivales");
          updatePlayersUI();
        } catch (err) {
          showToast("Error al crear la sala");
        }
      });

      els.btnJoinRoom.addEventListener("click", async () => {
        myName = els.inputName.value.trim();
        roomCode = els.inputRoomCode.value.trim().toUpperCase();
        if (!myName) return showToast("Introduce tu nombre");
        if (!roomCode) return showToast("Introduce el código de sala");

        isHost = false;
        try {
          await initPeer();
          players[myId] = createPlayerData(myName);
          els.lobbySetup.classList.add("hidden");
          els.lobbyRoom.classList.remove("hidden");
          els.roomCodeDisplay.textContent = roomCode;
          connectToPeer(PEER_PREFIX + roomCode);
        } catch (err) {
          showToast("Error al conectar");
        }
      });

      function connectToPeer(targetId) {
        els.lobbyMsg.textContent = "Conectando con la sala...";
        setStatus("connecting", "conectando");
        const conn = peer.connect(targetId);
        attachConnHandlers(conn);
      }

      function attachConnHandlers(conn) {
        let settled = false;

        const timeoutId = setTimeout(() => {
          if (settled) return;
          settled = true;
          try { conn.close(); } catch (err) {}
          delete connections[conn.peer];
          if (isHost) {
            els.lobbyMsg.textContent = "Un rival no pudo conectar, esperando nuevos jugadores...";
            setStatus("connecting", "esperando rivales");
          } else {
            els.lobbyMsg.textContent = "No se pudo conectar, verifica el código de la sala";
            setStatus("", "sin conectar");
          }
        }, CONNECT_TIMEOUT_MS);

        conn.on("open", () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);

          if (isHost && Object.keys(players).length >= MAX_PLAYERS) {
            conn.send({ type: "full" });
            conn.close();
            return;
          }

          els.lobbyMsg.textContent = "¡Jugador conectado!";
          setStatus("connected", "conectado");
          connections[conn.peer] = conn;
          conn.send({ type: "join", name: myName });
        });

        conn.on("data", (data) => handleData(conn.peer, data));

        conn.on("close", () => {
          settled = true;
          clearTimeout(timeoutId);
          delete connections[conn.peer];
          delete players[conn.peer];
          updatePlayersUI();
          checkAllReady();
          updateHostCounter();
          showToast("Un jugador se ha desconectado");
        });

        conn.on("error", (err) => {
          settled = true;
          clearTimeout(timeoutId);
          console.error(err);
          showToast("Error en la conexión");
        });
      }

      function broadcast(data) {
        Object.values(connections).forEach((c) => {
          if (c.open) c.send(data);
        });
      }

      function handleData(senderId, data) {
        switch (data.type) {
          case "full":
            showToast("La sala está llena");
            location.reload();
            break;

          case "kicked":
            showToast("Has sido expulsado de la sala");
            setTimeout(() => location.reload(), 1500);
            break;

          case "join":
            players[senderId] = createPlayerData(data.name);
            updatePlayersUI();
            if (isHost) broadcastList();
            break;

          case "player-list":
            players = data.players;
            updatePlayersUI();
            break;

          case "ready":
            if (players[senderId]) players[senderId].ready = data.ready;
            updatePlayersUI();
            checkAllReady();
            break;

          case "ready-next":
            if (players[senderId]) players[senderId].readyNext = data.readyNext;
            if (isHost) {
              updateHostCounter();
              broadcastList();
            }
            break;

          case "start-countdown":
            secretWord = data.word;
            startCountdown();
            break;

          case "guess":
            if (players[senderId]) {
              players[senderId].row = data.row + 1;
              players[senderId].greens = data.greens;
              players[senderId].yellows = data.yellows;
              updateRivalBoard(senderId, data.row, data.pattern);
            }
            break;

          case "finish":
            if (players[senderId]) {
              players[senderId].finished = true;
              players[senderId].won = data.won;
              players[senderId].rank = data.rank;
              players[senderId].greens = data.greens;
              players[senderId].yellows = data.yellows;
              players[senderId].finishTime = data.finishTime;
              finishedCount++;
              if (data.won) winnerCount++;
              checkGameEnd();
            }
            break;
        }
      }

      function broadcastList() {
        broadcast({ type: "player-list", players });
      }

      function kickPlayer(targetId) {
        if (!isHost || !connections[targetId]) return;
        connections[targetId].send({ type: "kicked" });
        setTimeout(() => {
          if (connections[targetId]) connections[targetId].close();
          delete connections[targetId];
          delete players[targetId];
          updatePlayersUI();
          broadcastList();
          checkAllReady();
          updateHostCounter();
          showToast("Jugador expulsado");
        }, 200);
      }

      function updatePlayersUI() {
        els.playersList.innerHTML = "";
        Object.entries(players).forEach(([id, p]) => {
          const item = document.createElement("div");
          item.className = "player-item";
          const showKick = isHost && id !== myId;

          item.innerHTML = `
            <div class="player-info-group">
              <span>${p.name} ${id === myId ? "<strong>(Tú)</strong>" : ""} ${id === PEER_PREFIX + roomCode ? "👑" : ""}</span>
              ${showKick ? `<button class="btn-kick" data-kick="${id}">Expulsar</button>` : ""}
            </div>
            <span class="player-badge ${p.ready ? "badge-ready" : "badge-waiting"}">
              ${p.ready ? "LISTO" : "ESPERANDO"}
            </span>
          `;

          if (showKick) {
            item.querySelector(`[data-kick="${id}"]`).addEventListener("click", () => kickPlayer(id));
          }

          els.playersList.appendChild(item);
        });
        checkAllReady();
      }

      els.btnReady.addEventListener("click", () => {
        isReady = !isReady;
        players[myId].ready = isReady;
        els.btnReady.textContent = isReady ? "CANCELAR" : "¡ESTOY LISTO!";
        els.btnReady.style.background = isReady ? "var(--gray-tile)" : "var(--green)";
        updatePlayersUI();

        if (isHost) broadcastList();
        else broadcast({ type: "ready", ready: isReady });
      });

      function checkAllReady() {
        if (!isHost) return;
        const pList = Object.values(players);
        const canStart = pList.length >= 2 && pList.every((p) => p.ready);
        els.btnStartGame.disabled = !canStart;
      }

      els.btnStartGame.addEventListener("click", () => {
        if (!isHost) return;
        secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        broadcast({ type: "start-countdown", word: secretWord });
        startCountdown();
      });

      function startCountdown() {
        els.screenLobby.classList.add("hidden");
        els.resultOverlay.classList.add("hidden");
        els.countdownOverlay.classList.remove("hidden");

        let count = 3;
        els.countdownNumber.textContent = count;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            els.countdownNumber.textContent = count;
          } else {
            clearInterval(timer);
            els.countdownOverlay.classList.add("hidden");
            startGame();
          }
        }, 900);
      }

      function startGame() {
        currentRow = 0;
        currentCol = 0;
        rowBuffers = Array.from({ length: 6 }, () => Array(5).fill(""));
        winnerCount = 0;
        finishedCount = 0;
        keyStates = {};
        isReadyNextRound = false;

        Object.keys(players).forEach((id) => {
          players[id].row = 0;
          players[id].finished = false;
          players[id].won = false;
          players[id].rank = null;
          players[id].greens = 0;
          players[id].yellows = 0;
          players[id].finishTime = 0;
          players[id].readyNext = false;
        });

        els.btnPlayerReadyNext.textContent = "Listo para otra ronda";
        els.btnPlayerReadyNext.style.background = "var(--green)";

        els.screenGame.classList.remove("hidden");
        setStatus("connected", "en partida");

        buildMyBoard();
        buildVirtualKeyboard();
        buildRivalBoards();
        focusTile(0, 0);
      }

      function buildMyBoard() {
        els.boardMe.innerHTML = "";
        for (let r = 0; r < 6; r++) {
          const rowForm = document.createElement("form");
          rowForm.className = "board-row";
          rowForm.dataset.row = r;
          rowForm.addEventListener("submit", (e) => {
            e.preventDefault();
            submitGuess();
          });

          for (let c = 0; c < 5; c++) {
            const wrap = document.createElement("div");
            wrap.className = "tile-wrap";
            wrap.dataset.row = r;
            wrap.dataset.col = c;

            const tile = document.createElement("div");
            tile.className = "tile";

            const input = document.createElement("input");
            input.type = "text";
            input.className = "tile-native-input";
            input.value = "";
            input.setAttribute("autocomplete", "off");
            input.setAttribute("autocorrect", "off");
            input.setAttribute("autocapitalize", "characters");
            input.setAttribute("enterkeyhint", "go");

            input.addEventListener("focus", () => focusTile(r, c));

            input.addEventListener("input", (e) => {
              if (players[myId].finished) return;
              const val = e.target.value.toUpperCase().replace(/[^A-ZÑ]/g, "");
              if (val) {
                setLetter(r, c, val.slice(-1));
                if (c < 4) focusTile(r, c + 1);
              }
              input.value = "";
            });

            input.addEventListener("keydown", (e) => {
              if (players[myId].finished) return;
              if (e.key === "Enter" || e.keyCode === 13) {
                e.preventDefault();
                submitGuess();
              } else if (e.key === "Backspace" || e.keyCode === 8) {
                if (!rowBuffers[r][c] && c > 0) {
                  focusTile(r, c - 1);
                  setLetter(r, c - 1, "");
                } else {
                  setLetter(r, c, "");
                }
              }
            });

            wrap.appendChild(tile);
            wrap.appendChild(input);
            rowForm.appendChild(wrap);
          }
          els.boardMe.appendChild(rowForm);
        }
      }

      function buildVirtualKeyboard() {
        els.virtualKeyboard.innerHTML = "";
        KEYBOARD_LAYOUT.forEach((rowKeys) => {
          const rowDiv = document.createElement("div");
          rowDiv.className = "keyboard-row";
          rowKeys.forEach((key) => {
            const keyDiv = document.createElement("div");
            keyDiv.className = "key-tile";
            keyDiv.dataset.key = key;
            keyDiv.textContent = key;
            rowDiv.appendChild(keyDiv);
          });
          els.virtualKeyboard.appendChild(rowDiv);
        });
      }

      function updateVirtualKeyboard(word, pattern) {
        for (let i = 0; i < 5; i++) {
          const letter = word[i];
          const status = pattern[i];

          if (status === "correct") {
            keyStates[letter] = "correct";
          } else if (status === "present" && keyStates[letter] !== "correct") {
            keyStates[letter] = "present";
          } else if (status === "absent" && !keyStates[letter]) {
            keyStates[letter] = "absent";
          }
        }

        Object.entries(keyStates).forEach(([letter, state]) => {
          const keyEl = els.virtualKeyboard.querySelector(`.key-tile[data-key="${letter}"]`);
          if (keyEl) {
            keyEl.classList.remove("correct", "present", "absent");
            keyEl.classList.add(state);
          }
        });
      }

      function focusTile(r, c) {
        if (r !== currentRow || players[myId].finished) return;
        currentCol = c;
        document.querySelectorAll(".tile-wrap").forEach((w) => w.classList.remove("focused"));
        const wrap = els.boardMe.querySelector(`.tile-wrap[data-row="${r}"][data-col="${c}"]`);
        if (wrap) {
          wrap.classList.add("focused");
          const inp = wrap.querySelector(".tile-native-input");
          if (document.activeElement !== inp) inp.focus();
        }
      }

      function setLetter(r, c, letter) {
        rowBuffers[r][c] = letter;
        const wrap = els.boardMe.querySelector(`.tile-wrap[data-row="${r}"][data-col="${c}"]`);
        if (wrap) wrap.querySelector(".tile").textContent = letter;
      }

      function buildRivalBoards() {
        els.rivalsGrid.innerHTML = "";
        Object.entries(players).forEach(([id, p]) => {
          if (id === myId) return;

          const card = document.createElement("div");
          card.className = "rival-card";
          card.id = `rival-card-${id}`;
          card.innerHTML = `
            <div class="rival-header" style="display:flex; justify-space-between; margin-bottom: 5px;">
              <span>${p.name}</span>
              <span id="rival-att-${id}">0/6</span>
            </div>
            <div class="board board--rival" id="board-rival-${id}"></div>
          `;

          const board = card.querySelector(`#board-rival-${id}`);
          for (let r = 0; r < 6; r++) {
            const row = document.createElement("div");
            row.className = "board-row";
            row.dataset.row = r;
            for (let c = 0; c < 5; c++) {
              const wrap = document.createElement("div");
              wrap.className = "tile-wrap";
              const tile = document.createElement("div");
              tile.className = "tile";
              wrap.appendChild(tile);
              row.appendChild(wrap);
            }
            board.appendChild(row);
          }
          els.rivalsGrid.appendChild(card);
        });
      }

      function updateRivalBoard(rivalId, r, pattern) {
        const card = document.getElementById(`rival-card-${rivalId}`);
        if (!card) return;
        card.querySelector(`#rival-att-${rivalId}`).textContent = `${r + 1}/6`;
        const row = card.querySelector(`.board-row[data-row="${r}"]`);
        if (!row) return;
        const tiles = row.querySelectorAll(".tile");
        tiles.forEach((t, i) => t.classList.add(pattern[i]));
      }

      function submitGuess() {
        if (players[myId].finished) return;

        const word = rowBuffers[currentRow].join("");
        if (word.length < 5) return showToast("Completa las 5 letras");

        const pattern = evaluateGuess(word, secretWord);
        paintRow(currentRow, pattern);
        updateVirtualKeyboard(word, pattern);

        let currentGreens = pattern.filter((p) => p === "correct").length;
        let currentYellows = pattern.filter((p) => p === "present").length;

        players[myId].greens += currentGreens;
        players[myId].yellows += currentYellows;

        broadcast({
          type: "guess",
          row: currentRow,
          pattern,
          greens: players[myId].greens,
          yellows: players[myId].yellows,
        });

        const won = pattern.every((p) => p === "correct");

        if (won) {
          players[myId].finished = true;
          players[myId].won = true;
          players[myId].finishTime = Date.now();
          winnerCount++;
          finishedCount++;
          const rank = winnerCount;
          players[myId].rank = rank;

          broadcast({
            type: "finish",
            won: true,
            rank,
            greens: players[myId].greens,
            yellows: players[myId].yellows,
            finishTime: players[myId].finishTime,
          });

          showToast(`¡Adivinaste! Puesto #${rank}`);
          checkGameEnd();
        } else if (currentRow >= 5) {
          players[myId].finished = true;
          players[myId].won = false;
          players[myId].rank = null;
          players[myId].finishTime = Date.now();
          finishedCount++;

          broadcast({
            type: "finish",
            won: false,
            rank: null,
            greens: players[myId].greens,
            yellows: players[myId].yellows,
            finishTime: players[myId].finishTime,
          });

          showToast("Has agotado tus intentos");
          if (document.activeElement) document.activeElement.blur();
          checkGameEnd();
        } else {
          currentRow++;
          focusTile(currentRow, 0);
        }
      }

      function evaluateGuess(guess, target) {
        const res = Array(5).fill("absent");
        const tArr = target.split("");
        const used = Array(5).fill(false);

        for (let i = 0; i < 5; i++) {
          if (guess[i] === tArr[i]) {
            res[i] = "correct";
            used[i] = true;
          }
        }
        for (let i = 0; i < 5; i++) {
          if (res[i] === "correct") continue;
          const idx = tArr.findIndex((l, j) => !used[j] && l === guess[i]);
          if (idx !== -1) {
            res[i] = "present";
            used[idx] = true;
          }
        }
        return res;
      }

      function paintRow(r, pattern) {
        const row = els.boardMe.querySelector(`.board-row[data-row="${r}"]`);
        const wraps = row.querySelectorAll(".tile-wrap");
        wraps.forEach((w, i) => {
          w.querySelector(".tile").classList.add(pattern[i]);
        });
      }

      function checkGameEnd() {
        const totalPlayers = Object.keys(players).length;
        const pList = Object.values(players);

        // Lógica optimizada 1vs1 (2 jugadores)
        if (totalPlayers === 2) {
          const winnerExists = pList.some((p) => p.won);
          const allFinished = pList.every((p) => p.finished);

          if (winnerExists || allFinished) {
            setTimeout(showFinalResults, 600);
            return;
          }
        }

        // Lógica para más de 2 jugadores
        const winners = pList.filter((p) => p.won).length;
        if (finishedCount >= totalPlayers || (totalPlayers - finishedCount === 1 && winners === totalPlayers - 1)) {
          setTimeout(showFinalResults, 800);
        }
      }

      function updateHostCounter() {
        if (!isHost) return;
        const nonHostPlayers = Object.entries(players).filter(([id]) => id !== myId);
        const readyCount = nonHostPlayers.filter(([, p]) => p.readyNext).length;
        els.hostStatusCounter.textContent = `Listos para otra ronda: ${readyCount}/${nonHostPlayers.length}`;
      }

      function showFinalResults() {
        els.resultOverlay.classList.remove("hidden");
        els.resultWord.textContent = secretWord;
        els.leaderboard.innerHTML = "";

        const sorted = Object.values(players).sort((a, b) => {
          // 1. Gana quien haya acertado la palabra
          if (a.won && !b.won) return -1;
          if (!a.won && b.won) return 1;

          // 2. Si ambos acertaron, gana el de mejor posición (menor tiempo/intentos)
          if (a.won && b.won) return a.rank - b.rank;

          // 3. Si ninguno la acertó, desempate por aciertos (verdes, amarillos y tiempo)
          if (b.greens !== a.greens) return b.greens - a.greens;
          if (b.yellows !== a.yellows) return b.yellows - a.yellows;
          return a.finishTime - b.finishTime;
        });

        sorted.forEach((p, idx) => {
          const item = document.createElement("div");
          item.className = "player-item";

          let statusText = `#${idx + 1}`;
          let statusColor = "var(--text)";

          if (p.won) {
            statusText = `#${p.rank} (Ganador)`;
            statusColor = "var(--green)";
          } else {
            statusColor = "var(--red)";
          }

          item.innerHTML = `
            <div>
              <span style="font-weight:700;">${p.name}</span>
              <div style="font-size: 0.8rem; opacity: 0.8;">
                <span>🟩 ${p.greens}</span>
                <span style="margin-left:8px;">🟨 ${p.yellows}</span>
              </div>
            </div>
            <strong style="color:${statusColor}">${statusText}</strong>
          `;
          els.leaderboard.appendChild(item);
        });

        if (isHost) {
          els.btnNextRound.classList.remove("hidden");
          els.hostStatusCounter.classList.remove("hidden");
          els.btnPlayerReadyNext.classList.add("hidden");
          updateHostCounter();
        } else {
          els.btnNextRound.classList.add("hidden");
          els.hostStatusCounter.classList.add("hidden");
          els.btnPlayerReadyNext.classList.remove("hidden");
        }
      }

      els.btnPlayerReadyNext.addEventListener("click", () => {
        isReadyNextRound = !isReadyNextRound;
        players[myId].readyNext = isReadyNextRound;

        els.btnPlayerReadyNext.textContent = isReadyNextRound
          ? "Esperando a que empiece..."
          : "Listo para otra ronda";
        els.btnPlayerReadyNext.style.background = isReadyNextRound
          ? "var(--gray-tile)"
          : "var(--green)";

        broadcast({ type: "ready-next", readyNext: isReadyNextRound });
      });

      els.btnNextRound.addEventListener("click", () => {
        if (!isHost) return;
        secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        broadcast({ type: "start-countdown", word: secretWord });
        startCountdown();
      });

      els.btnBackLobby.addEventListener("click", () => {
        location.reload();
      });
    })();
  </script>
</body>
</html>
