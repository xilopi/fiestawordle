<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUELO - Wordle Multijugador</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --panel-border: #262626;
            --text-main: #f3f3f3;
            --text-muted: #888888;
            --accent: #ff6b35;
            --correct: #538d4e;
            --present: #b59f3b;
            --absent: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: '◆';
            color: var(--accent);
        }

        .status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: #1c1c1c;
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .dot.online { background: #10b981; }

        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
        }

        /* LOBBY INTERFACE */
        .hero-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hero-sub {
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 14px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card h3 { font-size: 20px; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #222; border: 1px solid var(--panel-border); }

        /* GAME BOARD */
        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin: 0 auto 30px auto;
            width: fit-content;
        }

        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

        .tile {
            width: 55px;
            height: 55px;
            border: 2px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
        }

        .tile.correct { background: var(--correct); border-color: var(--correct); }
        .tile.present { background: var(--present); border-color: var(--present); }
        .tile.absent { background: var(--absent); border-color: var(--absent); }

        /* KEYBOARD */
        .keyboard { display: flex; flex-direction: column; gap: 8px; max-width: 500px; margin: 0 auto; }
        .kb-row { display: flex; justify-content: center; gap: 6px; }
        .key {
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            height: 50px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        .key.large { flex: 1.5; }
        .key.correct { background: var(--correct); }
        .key.present { background: var(--present); }
        .key.absent { background: var(--absent); }

        .hidden { display: none !important; }
        .player-list { list-style: none; margin: 15px 0; }
        .player-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--panel-border); }
    </style>
</head>
<body>

    <header>
        <div class="logo">DUELO</div>
        <div class="status-badge"><div id="status-dot" class="dot"></div><span id="status-text">Sin conectar</span></div>
    </header>

    <div class="main-container">
        <!-- PANTALLA INICIAL -->
        <div id="lobby-screen">
            <h1 class="hero-title">Wordle Multijugador</h1>
            <p class="hero-sub">Hasta 7 jugadores en tiempo real. Adivina la palabra antes que los demás.</p>

            <div class="input-group">
                <label>Tu Nombre</label>
                <input type="text" id="nickname" placeholder="Introduce tu apodo">
            </div>

            <div class="grid-cards">
                <div class="card">
                    <h3>Crear Sala</h3>
                    <button class="btn" onclick="createRoom()">Crear nueva partida</button>
                </div>
                <div class="card">
                    <h3>Unirse a Sala</h3>
                    <input type="text" id="room-code" placeholder="Código (4 dígitos)">
                    <button class="btn btn-secondary" onclick="joinRoom()">Entrar</button>
                </div>
            </div>
        </div>

        <!-- SALA DE ESPERA -->
        <div id="room-screen" class="card hidden">
            <h2 id="room-title">Sala: ----</h2>
            <ul id="players-ul" class="player-list"></ul>
            <button id="start-btn" onclick="hostStartGame()" class="btn hidden">Empezar Partida</button>
        </div>

        <!-- JUEGO -->
        <div id="game-screen" class="hidden">
            <div class="board" id="board"></div>
            <div class="keyboard" id="keyboard"></div>
        </div>

        <!-- RESULTADOS -->
        <div id="results-screen" class="card hidden">
            <h2>Clasificación de la ronda</h2>
            <div id="ranking-list" style="margin: 20px 0;"></div>
            <button id="next-round-btn" onclick="readyForNextRound()" class="btn">Listo para la siguiente ronda</button>
        </div>
    </div>

<script>
    const WORDS = ["PERRO", "GATOS", "CASAS", "ARBOL", "LIBRO", "PLAZA", "FUEGO", "NUBE", "CARTA", "PIANO"];
    let peer = null, connections = [], hostConn = null, isHost = false;
    let myId = "", myName = "", roomCode = "", targetWord = "", currentAttempt = 0, currentGuess = "", gameOver = false;
    let players = {}, startTime = 0;

    function setStatus(text, online = false) {
        document.getElementById('status-text').innerText = text;
        const dot = document.getElementById('status-dot');
        if (online) dot.classList.add('online'); else dot.classList.remove('online');
    }

    function initBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            for (let j = 0; j < 5; j++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.id = `tile-${i}-${j}`;
                row.appendChild(tile);
            }
            board.appendChild(row);
        }
        initKeyboard();
    }

    function initKeyboard() {
        const keyboard = document.getElementById('keyboard');
        keyboard.innerHTML = '';
        const rows = [
            ["Q","W","E","R","T","Y","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L","Ñ"],
            ["ENTER","Z","X","C","V","B","N","M","DEL"]
        ];

        rows.forEach(rowKeys => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'kb-row';
            rowKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = `key ${key.length > 1 ? 'large' : ''}`;
                btn.innerText = key;
                btn.id = `key-${key}`;
                btn.onclick = () => handleInput(key);
                rowDiv.appendChild(btn);
            });
            keyboard.appendChild(rowDiv);
        });
    }

    function createRoom() {
        myName = document.getElementById('nickname').value.trim() || "Jugador";
        roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;

        peer = new Peer(`duelo-${roomCode}`);
        peer.on('open', (id) => {
            myId = id;
            players[myId] = { name: myName, attempts: 0, won: false, greens: 0, yellows: 0, finishTime: 0, ready: false };
            setStatus("Host Conectado", true);
            showRoomUI();
        });

        peer.on('connection', (conn) => {
            if (Object.keys(players).length >= 7) {
                conn.send({ type: 'FULL' });
                setTimeout(() => conn.close(), 500);
                return;
            }
            connections.push(conn);
            setupConnListeners(conn);
        });
    }

    function joinRoom() {
        myName = document.getElementById('nickname').value.trim() || "Jugador";
        roomCode = document.getElementById('room-code').value.trim();
        if (!roomCode) return;

        peer = new Peer();
        peer.on('open', (id) => {
            myId = id;
            hostConn = peer.connect(`duelo-${roomCode}`);
            setupConnListeners(hostConn);
            setStatus("Conectado", true);
        });
    }

    function setupConnListeners(conn) {
        conn.on('open', () => {
            if (!isHost) conn.send({ type: 'JOIN', name: myName, id: myId });
        });

        conn.on('data', (data) => {
            if (isHost) handleHostMessages(data, conn);
            else handleClientMessages(data);
        });
    }

    function handleHostMessages(data, conn) {
        if (data.type === 'JOIN') {
            players[data.id] = { name: data.name, attempts: 0, won: false, greens: 0, yellows: 0, finishTime: 0, ready: false };
            broadcast({ type: 'PLAYER_UPDATE', players });
            updatePlayerListUI();
        }
        if (data.type === 'UPDATE_PROGRESS') {
            players[data.id] = { ...players[data.id], ...data.payload };
            broadcast({ type: 'PLAYER_UPDATE', players });
            evaluateRoundEnd();
        }
        if (data.type === 'READY_NEXT') {
            if (players[data.id]) players[data.id].ready = true;
            broadcast({ type: 'PLAYER_UPDATE', players });
            checkAllReady();
        }
    }

    function handleClientMessages(data) {
        if (data.type === 'PLAYER_UPDATE') {
            players = data.players;
            updatePlayerListUI();
        }
        if (data.type === 'START_GAME') {
            targetWord = data.word;
            startGameUI();
        }
        if (data.type === 'END_ROUND') {
            showResultsUI(data.rankings);
        }
    }

    function broadcast(data) {
        connections.forEach(conn => conn.send(data));
    }

    function showRoomUI() {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('room-screen').classList.remove('hidden');
        document.getElementById('room-title').innerText = `Sala: ${roomCode}`;
        if (isHost) document.getElementById('start-btn').classList.remove('hidden');
        updatePlayerListUI();
    }

    function updatePlayerListUI() {
        const ul = document.getElementById('players-ul');
        ul.innerHTML = '';
        Object.entries(players).forEach(([id, p]) => {
            const li = document.createElement('li');
            li.className = 'player-item';
            li.innerHTML = `<span>${p.name} ${p.ready ? '✅' : ''}</span>`;
            if (isHost && id !== myId) {
                const kickBtn = document.createElement('button');
                kickBtn.innerText = '✕';
                kickBtn.style.background = 'transparent';
                kickBtn.style.border = 'none';
                kickBtn.style.color = '#ff4444';
                kickBtn.style.cursor = 'pointer';
                kickBtn.onclick = () => kickPlayer(id);
                li.appendChild(kickBtn);
            }
            ul.appendChild(li);
        });
    }

    function kickPlayer(id) {
        delete players[id];
        connections = connections.filter(c => c.peer !== id);
        broadcast({ type: 'PLAYER_UPDATE', players });
        updatePlayerListUI();
    }

    function hostStartGame() {
        targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        broadcast({ type: 'START_GAME', word: targetWord });
        startGameUI();
    }

    function startGameUI() {
        currentAttempt = 0;
        currentGuess = "";
        gameOver = false;
        startTime = Date.now();

        document.getElementById('room-screen').classList.add('hidden');
        document.getElementById('results-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        initBoard();
    }

    function handleInput(key) {
        if (gameOver) return;

        if (key === 'ENTER') {
            if (currentGuess.length === 5) submitGuess();
        } else if (key === 'DEL') {
            if (currentGuess.length > 0) {
                currentGuess = currentGuess.slice(0, -1);
                updateRowUI();
            }
        } else if (currentGuess.length < 5 && /^[A-ZÑ]$/.test(key)) {
            currentGuess += key;
            updateRowUI();
        }
    }

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('game-screen').classList.contains('hidden')) return;
        const key = e.key.toUpperCase();
        if (key === 'ENTER') handleInput('ENTER');
        else if (key === 'BACKSPACE') handleInput('DEL');
        else if (/^[A-ZÑ]$/.test(key)) handleInput(key);
    });

    function updateRowUI() {
        for (let j = 0; j < 5; j++) {
            const tile = document.getElementById(`tile-${currentAttempt}-${j}`);
            tile.innerText = currentGuess[j] || '';
        }
    }

    function submitGuess() {
        let greens = 0;
        let yellows = 0;
        const targetArr = targetWord.split('');
        const guessArr = currentGuess.split('');

        guessArr.forEach((char, i) => {
            const tile = document.getElementById(`tile-${currentAttempt}-${i}`);
            const keyBtn = document.getElementById(`key-${char}`);

            if (char === targetArr[i]) {
                greens++;
                tile.classList.add('correct');
                if (keyBtn) keyBtn.className = 'key correct';
                targetArr[i] = null;
            }
        });

        guessArr.forEach((char, i) => {
            const tile = document.getElementById(`tile-${currentAttempt}-${i}`);
            const keyBtn = document.getElementById(`key-${char}`);

            if (tile.classList.contains('correct')) return;

            if (targetArr.includes(char)) {
                yellows++;
                tile.classList.add('present');
                if (keyBtn && !keyBtn.classList.contains('correct')) keyBtn.className = 'key present';
                targetArr[targetArr.indexOf(char)] = null;
            } else {
                tile.classList.add('absent');
                if (keyBtn && !keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
                    keyBtn.className = 'key absent';
                }
            }
        });

        const won = currentGuess === targetWord;
        currentAttempt++;
        currentGuess = "";

        if (won || currentAttempt >= 6) {
            gameOver = true;
        }

        const payload = {
            attempts: currentAttempt,
            won,
            greens,
            yellows,
            finishTime: Date.now() - startTime
        };

        if (isHost) {
            players[myId] = { ...players[myId], ...payload };
            evaluateRoundEnd();
        } else {
            hostConn.send({ type: 'UPDATE_PROGRESS', id: myId, payload });
        }
    }

    function evaluateRoundEnd() {
        if (!isHost) return;

        const activePlayers = Object.entries(players);
        const total = activePlayers.length;

        // REGLA 1VS1 (2 Jugadores)
        if (total === 2) {
            const [p1Id, p1] = activePlayers[0];
            const [p2Id, p2] = activePlayers[1];

            let winnerId = null;

            if (p1.won) winnerId = p1Id;
            else if (p2.won) winnerId = p2Id;
            else if (p1.attempts >= 6 && !p1.won) winnerId = p2Id;
            else if (p2.attempts >= 6 && !p2.won) winnerId = p1Id;

            if (winnerId) {
                const rankings = activePlayers
                    .map(([id, p]) => ({ id, ...p }))
                    .sort((a, b) => (a.id === winnerId ? -1 : 1));
                
                broadcast({ type: 'END_ROUND', rankings });
                showResultsUI(rankings);
                return;
            }
        }

        // MULTIJUGADOR (3-7 Jugadores)
        const allFinished = activePlayers.every(([_, p]) => p.won || p.attempts >= 6);
        if (allFinished) {
            const rankings = activePlayers.map(([id, p]) => ({ id, ...p })).sort((a, b) => {
                if (a.won && !b.won) return -1;
                if (!a.won && b.won) return 1;
                if (a.won && b.won) return a.finishTime - b.finishTime;

                if (b.greens !== a.greens) return b.greens - a.greens;
                if (b.yellows !== a.yellows) return b.yellows - a.yellows;
                return a.finishTime - b.finishTime;
            });

            broadcast({ type: 'END_ROUND', rankings });
            showResultsUI(rankings);
        }
    }

    function showResultsUI(rankings) {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('results-screen').classList.remove('hidden');

        const list = document.getElementById('ranking-list');
        list.innerHTML = '';
        rankings.forEach((p, idx) => {
            const item = document.createElement('div');
            item.className = 'player-item';
            item.innerHTML = `
                <span>#${idx + 1} ${p.name}</span>
                <span>${p.won ? '🏆 Ganó' : '❌ Perdió'} (${p.attempts}/6)</span>
            `;
            list.appendChild(item);
        });
    }

    function readyForNextRound() {
        document.getElementById('next-round-btn').disabled = true;
        if (isHost) {
            players[myId].ready = true;
            checkAllReady();
        } else {
            hostConn.send({ type: 'READY_NEXT', id: myId });
        }
    }

    function checkAllReady() {
        if (!isHost) return;
        const allReady = Object.values(players).every(p => p.ready);
        if (allReady) {
            Object.keys(players).forEach(id => players[id].ready = false);
            document.getElementById('next-round-btn').disabled = false;
            hostStartGame();
        }
    }
</script>
</body>
</html>
