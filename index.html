<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiesta Wordle</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0e0e;
            --panel-bg: #111111;
            --input-bg: #151515;
            --border-color: #1a1a1a;
            --text-main: #f0f0f0;
            --text-muted: #555555;
            --accent: #ff6b35; /* El naranja que tenías */
            --correct: #538d4e;
            --present: #b59f3b;
            --absent: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER ORIGINAL (Estilo consola) */
        header {
            width: 100%;
            max-width: 1000px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .logo::before {
            content: '◆';
            color: var(--accent);
            font-size: 16px;
        }

        .status-badge {
            font-size: 12px;
            background: #181818;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; transition: background 0.2s; }
        .dot.online { background: #10b981; }

        .main-container {
            width: 100%;
            max-width: 1000px;
            padding: 50px 25px;
        }

        /* ESTILOS DE PANTALLA INICIAL (Lobby) */
        .lobby-hero {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .hero-sub {
            color: var(--text-muted);
            font-size: 14px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .input-group {
            max-width: 600px;
            margin: 0 auto 40px auto;
        }

        label.terminal-label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"].terminal-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"].terminal-input:focus {
            border-color: #333;
            box-shadow: 0 0 10px rgba(255,107,53,0.05);
        }

        /* GRID DE TARJETAS LOBBY */
        .lobby-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        .lobby-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .lobby-card h3 { font-size: 20px; font-weight: 700; }

        .lobby-card input {
            padding: 14px;
            font-size: 14px;
        }

        /* BOTONES ORIGINALES (Terminal) */
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            width: 100%;
        }

        .btn:hover { background: #ff8c61; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #202020; border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #282828; }

        /* ESTILOS DE SALA DE ESPERA (Room) - FOTO 1 */
        .room-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .room-title-group h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .player-list-original {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .player-item-original {
            background: #181818;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 18px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name-wrap { display: flex; align-items: center; gap: 8px; }

        .kick-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }
        .kick-btn:hover { color: #ff4444; }

        .room-code-display {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text-muted);
            opacity: 0.8;
        }

        /* GAME BOARD */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 40px;
        }

        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

        .tile {
            width: 60px;
            height: 60px;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
        }

        .tile.correct { background: var(--correct); border-color: var(--correct); }
        .tile.present { background: var(--present); border-color: var(--present); }
        .tile.absent { background: var(--absent); border-color: var(--absent); }

        /* KEYBOARD ORIGINAL */
        .keyboard { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .kb-row { display: flex; justify-content: center; gap: 6px; }
        .key {
            background: #202020;
            color: white;
            border: none;
            border-radius: 6px;
            height: 52px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            font-size: 13px;
        }
        .key.large { flex: 1.6; }
        .key.correct { background: var(--correct); }
        .key.present { background: var(--present); }
        .key.absent { background: var(--absent); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">DUELO</div>
        <div class="status-badge"><div id="status-dot" class="dot"></div><span id="status-text">Sin conectar</span></div>
    </header>

    <div class="main-container">
        <!-- PANTALLA INICIAL (Lobby) - FOTO 2 -->
        <div id="lobby-screen">
            <div class="lobby-hero">
                <h1 class="hero-title">Wordle Multijugador</h1>
                <p class="hero-sub">Hasta 7 jugadores en tiempo real. Adivina la palabra antes que los demás.</p>
            </div>

            <div class="input-group">
                <label class="terminal-label">Tu Nombre</label>
                <input type="text" id="nickname" class="terminal-input" placeholder="Introduce tu apodo">
            </div>

            <div class="lobby-grid">
                <div class="lobby-card">
                    <h3>Crear Sala</h3>
                    <button class="btn" onclick="createRoom()">Crear nueva partida</button>
                </div>
                <div class="lobby-card">
                    <h3>Unirse a Sala</h3>
                    <input type="text" id="room-code" class="terminal-input" placeholder="Código (4 dígitos)">
                    <button class="btn btn-secondary" onclick="joinRoom()">Entrar</button>
                </div>
            </div>
        </div>

        <!-- SALA DE ESPERA (Room) - FOTO 1 -->
        <div id="room-screen" class="room-panel hidden">
            <div class="room-header">
                <div class="room-title-group">
                    <h2 id="room-title">Sala: ----</h2>
                    <ul id="players-ul" class="player-list-original"></ul>
                </div>
                <div class="room-code-display" id="room-code-big">XXXX</div>
            </div>
            
            <button id="start-btn" onclick="hostStartGame()" class="btn hidden">Empezar Partida</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen" class="hidden">
            <div class="game-area">
                <div class="board" id="board"></div>
                <div class="keyboard" id="keyboard"></div>
            </div>
        </div>

        <!-- RESULTADOS (Rankings) -->
        <div id="results-screen" class="room-panel hidden">
            <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase;">Resultados de la Ronda</h2>
            <div id="ranking-list" style="margin-bottom: 30px;"></div>
            <button id="next-round-btn" onclick="readyForNextRound()" class="btn btn-secondary">Listo para siguiente ronda</button>
        </div>
    </div>

<script>
    const WORDS = ["PERRO", "GATOS", "CASAS", "ARBOL", "LIBRO", "PLAZA", "FUEGO", "NUBE", "CARTA", "PIANO"];
    let peer = null, connections = [], hostConn = null, isHost = false;
    let myId = "", myName = "", roomCode = "", targetWord = "", currentAttempt = 0, currentGuess = "", gameOver = false;
    let players = {}, startTime = 0;

    function setStatus(text, online = false) {
        document.getElementById('status-text').innerText = text;
        const dot = document.getElementById('status-dot');
        if (online) dot.classList.add('online'); else dot.classList.remove('online');
    }

    function initBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            for (let j = 0; j < 5; j++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.id = `tile-${i}-${j}`;
                row.appendChild(tile);
            }
            board.appendChild(row);
        }
        initKeyboard();
    }

    function initKeyboard() {
        const keyboard = document.getElementById('keyboard');
        keyboard.innerHTML = '';
        const rows = [
            ["Q","W","E","R","T","Y","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L","Ñ"],
            ["ENTER","Z","X","C","V","B","N","M","DEL"]
        ];

        rows.forEach(rowKeys => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'kb-row';
            rowKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = `key ${key.length > 1 ? 'large' : ''}`;
                btn.innerText = key;
                btn.id = `key-${key}`;
                btn.onclick = () => handleInput(key);
                rowDiv.appendChild(btn);
            });
            keyboard.appendChild(rowDiv);
        });
    }

    function createRoom() {
        myName = document.getElementById('nickname').value.trim() || "Jugador";
        roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;

        peer = new Peer(`duelo-${roomCode}`);
        peer.on('open', (id) => {
            myId = id;
            players[myId] = { name: myName, attempts: 0, won: false, greens: 0, yellows: 0, finishTime: 0, ready: false };
            setStatus("Host Conectado", true);
            showRoomUI();
        });

        peer.on('connection', (conn) => {
            if (Object.keys(players).length >= 7) {
                conn.send({ type: 'FULL' });
                setTimeout(() => conn.close(), 500);
                return;
            }
            connections.push(conn);
            setupConnListeners(conn);
        });
    }

    function joinRoom() {
        myName = document.getElementById('nickname').value.trim() || "Jugador";
        roomCode = document.getElementById('room-code').value.trim();
        if (!roomCode) return;

        peer = new Peer();
        peer.on('open', (id) => {
            myId = id;
            hostConn = peer.connect(`duelo-${roomCode}`);
            setupConnListeners(hostConn);
            setStatus("Conectado", true);
        });
    }

    function setupConnListeners(conn) {
        conn.on('open', () => {
            if (!isHost) conn.send({ type: 'JOIN', name: myName, id: myId });
        });

        conn.on('data', (data) => {
            if (isHost) handleHostMessages(data, conn);
            else handleClientMessages(data);
        });
    }

    function handleHostMessages(data, conn) {
        if (data.type === 'JOIN') {
            players[data.id] = { name: data.name, attempts: 0, won: false, greens: 0, yellows: 0, finishTime: 0, ready: false };
            broadcast({ type: 'PLAYER_UPDATE', players });
            updatePlayerListUI();
        }
        if (data.type === 'UPDATE_PROGRESS') {
            players[data.id] = { ...players[data.id], ...data.payload };
            broadcast({ type: 'PLAYER_UPDATE', players });
            evaluateRoundEnd();
        }
        if (data.type === 'READY_NEXT') {
            if (players[data.id]) players[data.id].ready = true;
            broadcast({ type: 'PLAYER_UPDATE', players });
            checkAllReady();
        }
    }

    function handleClientMessages(data) {
        if (data.type === 'PLAYER_UPDATE') {
            players = data.players;
            updatePlayerListUI();
        }
        if (data.type === 'START_GAME') {
            targetWord = data.word;
            startGameUI();
        }
        if (data.type === 'END_ROUND') {
            showResultsUI(data.rankings);
        }
    }

    function broadcast(data) {
        connections.forEach(conn => conn.send(data));
    }

    function showRoomUI() {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('room-screen').classList.remove('hidden');
        document.getElementById('room-title').innerText = `Sala: ${roomCode}`;
        document.getElementById('room-code-big').innerText = roomCode; // Código en grande (Foto 1)
        if (isHost) document.getElementById('start-btn').classList.remove('hidden');
        updatePlayerListUI();
    }

    function updatePlayerListUI() {
        const ul = document.getElementById('players-ul');
        ul.innerHTML = '';
        Object.entries(players).forEach(([id, p]) => {
            const li = document.createElement('li');
            li.className = 'player-item-original';
            li.innerHTML = `
                <div class="player-name-wrap">
                    <span>${p.name}</span>
                    ${p.ready ? '<span style="color: #10b981; font-size: 11px; text-transform: uppercase;">[LISTO]</span>' : ''}
                </div>
            `;
            if (isHost && id !== myId) {
                const kickBtn = document.createElement('button');
                kickBtn.className = 'kick-btn';
                kickBtn.innerText = '✕';
                kickBtn.onclick = () => kickPlayer(id);
                li.appendChild(kickBtn);
            }
            ul.appendChild(li);
        });
    }

    function kickPlayer(id) {
        delete players[id];
        connections = connections.filter(c => c.peer !== id);
        broadcast({ type: 'PLAYER_UPDATE', players });
        updatePlayerListUI();
    }

    function hostStartGame() {
        targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        broadcast({ type: 'START_GAME', word: targetWord });
        startGameUI();
    }

    function startGameUI() {
        currentAttempt = 0;
        currentGuess = "";
        gameOver = false;
        startTime = Date.now();

        document.getElementById('room-screen').classList.add('hidden');
        document.getElementById('results-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        initBoard();
    }

    function handleInput(key) {
        if (gameOver) return;

        if (key === 'ENTER') {
            if (currentGuess.length === 5) submitGuess();
        } else if (key === 'DEL') {
            if (currentGuess.length > 0) {
                currentGuess = currentGuess.slice(0, -1);
                updateRowUI();
            }
        } else if (currentGuess.length < 5 && /^[A-ZÑ]$/.test(key)) {
            currentGuess += key;
            updateRowUI();
        }
    }

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('game-screen').classList.contains('hidden')) return;
        const key = e.key.toUpperCase();
        if (key === 'ENTER') handleInput('ENTER');
        else if (key === 'BACKSPACE') handleInput('DEL');
        else if (/^[A-ZÑ]$/.test(key)) handleInput(key);
    });

    function updateRowUI() {
        for (let j = 0; j < 5; j++) {
            const tile = document.getElementById(`tile-${currentAttempt}-${j}`);
            tile.innerText = currentGuess[j] || '';
        }
    }

    function submitGuess() {
        let greens = 0;
        let yellows = 0;
        const targetArr = targetWord.split('');
        const guessArr = currentGuess.split('');

        guessArr.forEach((char, i) => {
            const tile = document.getElementById(`tile-${currentAttempt}-${i}`);
            const keyBtn = document.getElementById(`key-${char}`);

            if (char === targetArr[i]) {
                greens++;
                tile.classList.add('correct');
                if (keyBtn) keyBtn.className = 'key correct';
                targetArr[i] = null;
            }
        });

        guessArr.forEach((char, i) => {
            const tile = document.getElementById(`tile-${currentAttempt}-${i}`);
            const keyBtn = document.getElementById(`key-${char}`);

            if (tile.classList.contains('correct')) return;

            if (targetArr.includes(char)) {
                yellows++;
                tile.classList.add('present');
                if (keyBtn && !keyBtn.classList.contains('correct')) keyBtn.className = 'key present';
                targetArr[targetArr.indexOf(char)] = null;
            } else {
                tile.classList.add('absent');
                if (keyBtn && !keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
                    keyBtn.className = 'key absent';
                }
            }
        });

        const won = currentGuess === targetWord;
        currentAttempt++;
        currentGuess = "";

        if (won || currentAttempt >= 6) {
            gameOver = true;
        }

        const payload = {
            attempts: currentAttempt,
            won,
            greens,
            yellows,
            finishTime: Date.now() - startTime
        };

        if (isHost) {
            players[myId] = { ...players[myId], ...payload };
            evaluateRoundEnd();
        } else {
            hostConn.send({ type: 'UPDATE_PROGRESS', id: myId, payload });
        }
    }

    function evaluateRoundEnd() {
        if (!isHost) return;

        const activePlayers = Object.entries(players);
        const total = activePlayers.length;

        // LÓGICA 1VS1 (2 Jugadores) - CORE REGRESA AQUÍ
        if (total === 2) {
            const [p1Id, p1] = activePlayers[0];
            const [p2Id, p2] = activePlayers[1];

            let winnerId = null;

            if (p1.won) winnerId = p1Id;
            else if (p2.won) winnerId = p2Id;
            else if (p1.attempts >= 6 && !p1.won) winnerId = p2Id; // P1 pierde
            else if (p2.attempts >= 6 && !p2.won) winnerId = p1Id; // P2 pierde

            if (winnerId) {
                const rankings = activePlayers
                    .map(([id, p]) => ({ id, ...p }))
                    .sort((a, b) => (a.id === winnerId ? -1 : 1));
                
                broadcast({ type: 'END_ROUND', rankings });
                showResultsUI(rankings);
                return;
            }
        }

        // LÓGICA MULTIJUGADOR (3 a 7 jugadores)
        const allFinished = activePlayers.every(([_, p]) => p.won || p.attempts >= 6);
        if (allFinished) {
            const rankings = activePlayers.map(([id, p]) => ({ id, ...p })).sort((a, b) => {
                if (a.won && !b.won) return -1;
                if (!a.won && b.won) return 1;
                if (a.won && b.won) return a.finishTime - b.finishTime;

                if (b.greens !== a.greens) return b.greens - a.greens;
                if (b.yellows !== a.yellows) return b.yellows - a.yellows;
                return a.finishTime - b.finishTime;
            });

            broadcast({ type: 'END_ROUND', rankings });
            showResultsUI(rankings);
        }
    }

    function showResultsUI(rankings) {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('results-screen').classList.remove('hidden');

        const list = document.getElementById('ranking-list');
        list.innerHTML = '';
        rankings.forEach((p, idx) => {
            const item = document.createElement('div');
            item.className = 'player-item-original';
            item.innerHTML = `
                <span>#${idx + 1} ${p.name}</span>
                <span style="text-transform: uppercase; font-weight: 700;">
                    ${p.won ? '<span style="color: #10b981;">[GANÓ]</span>' : '<span style="color: #ff4444;">[PERDIÓ]</span>'} 
                    ${p.attempts}/6 ${idx === 0 ? '🏆' : ''}
                </span>
            `;
            list.appendChild(item);
        });
    }

    function readyForNextRound() {
        document.getElementById('next-round-btn').disabled = true;
        if (isHost) {
            players[myId].ready = true;
            checkAllReady();
        } else {
            hostConn.send({ type: 'READY_NEXT', id: myId });
        }
    }

    function checkAllReady() {
        if (!isHost) return;
        const allReady = Object.values(players).every(p => p.ready);
        if (allReady) {
            Object.keys(players).forEach(id => players[id].ready = false);
            document.getElementById('next-round-btn').disabled = false;
            hostStartGame();
        }
    }
</script>
</body>
</html>
