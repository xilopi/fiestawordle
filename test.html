<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba WebRTC</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    button, input {
      padding: 12px;
      margin: 5px 0;
      font-size: 16px;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      white-space: pre-wrap;
    }

    .ok { color: green; }
    .error { color: red; }
  </style>
</head>

<body>

<h1>Prueba WebRTC</h1>

<p>Tu ID:</p>
<strong id="myId">Conectando...</strong>

<hr>

<h3>Unirse a otro dispositivo</h3>

<input id="remoteId" placeholder="ID del otro dispositivo">
<button onclick="connectToPeer()">Conectar</button>

<div id="status">Iniciando PeerJS...</div>

<script>
  const status = document.getElementById("status");
  const myId = document.getElementById("myId");

  function log(text) {
    status.textContent += "\n" + text;
    console.log(text);
  }

  const peer = new Peer(undefined, {
    config: {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        },
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelayproject",
          credential: "openrelayproject"
        },
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelayproject",
          credential: "openrelayproject"
        }
      ]
    }
  });

  peer.on("open", id => {
    myId.textContent = id;
    status.textContent = "🟢 PeerJS conectado";
    log("ID: " + id);
  });

  peer.on("error", err => {
    log("🔴 ERROR PEERJS: " + err.type);
    log(err.message || "");
    console.error(err);
  });

  peer.on("connection", conn => {
    log("🟡 Alguien está intentando conectarse...");
    setupConnection(conn);
  });

  function connectToPeer() {
    const id = document.getElementById("remoteId").value.trim();

    if (!id) {
      alert("Escribe el ID del otro dispositivo");
      return;
    }

    log("🟡 Intentando conectar con: " + id);

    const conn = peer.connect(id, {
      reliable: true
    });

    setupConnection(conn);
  }

  function setupConnection(conn) {

    conn.on("open", () => {
      log("🟢🟢 CONEXIÓN WEBRTC ESTABLECIDA 🟢🟢");

      conn.send("Hola desde WebRTC");
    });

    conn.on("data", data => {
      log("📨 Mensaje recibido: " + data);
    });

    conn.on("close", () => {
      log("🔴 Conexión cerrada");
    });

    conn.on("error", err => {
      log("🔴 ERROR CONEXIÓN: " + err.message);
      console.error(err);
    });
  }
</script>

</body>
</html>
