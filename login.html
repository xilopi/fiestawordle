<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión - FiestaWordle</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Iniciar sesión</h1>

  <form id="loginForm">

    <label for="email">
      Usuario o email
    </label>

    <input
      type="text"
      id="email"
      required
    >

    <br><br>

    <label for="password">
      Contraseña
    </label>

    <input
      type="password"
      id="password"
      required
    >

    <br><br>

    <button type="submit">
      Iniciar sesión
    </button>

  </form>

  <p id="mensaje"></p>

  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document
          .getElementById("email")
          .value;

        const password = document
          .getElementById("password")
          .value;

        const mensaje = document
          .getElementById("mensaje");

        try {

          const respuesta = await fetch("/api/login", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })

          });

          const data = await respuesta.json();

          if (data.success) {

            // Guardamos la sesión del usuario
            localStorage.setItem(
              "userId",
              data.user.id
            );

            localStorage.setItem(
              "username",
              data.user.username
            );

            localStorage.setItem(
              "elo",
              data.user.elo
            );

            mensaje.textContent =
              "¡Bienvenido, " +
              data.user.username +
              "! Elo: " +
              data.user.elo;

            // Esperamos 1,5 segundos y vamos al juego
            setTimeout(function() {

              window.location.href = "/";

            }, 1500);

          } else {

            mensaje.textContent =
              data.message ||
              "Usuario o contraseña incorrectos";

          }

        } catch (error) {

          console.error(error);

          mensaje.textContent =
            "Error al conectar con el servidor";

        }

      });

  </script>

</body>
</html>
